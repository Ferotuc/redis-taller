services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      CACHE_TTL: 10
      DB_DELAY_MS: 200
    depends_on:
      redis:
        condition: service_healthy
